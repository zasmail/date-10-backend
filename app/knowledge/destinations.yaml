  - name: Sal
    country: Cape Verde
    region: Barlavento Islands
    coordinates: [16.7260, -22.9389]
    activities:
      kitesurfing:
        season: [11, 12, 1, 2, 3, 4, 5, 6]
        reliability: "80-90%"
        conditions: "Trade winds 15-30 knots. Kite Beach has flat water and waves. Santa Maria bay for beginners."
        skill_level: "all levels"
        notes: "Reliable trade winds, warm water (22-26°C). Good mix of flat water and wave spots."
      surfing:
        season: [11, 12, 1, 2, 3, 4]
        reliability: "70-80%"
        conditions: "NW swells bring chest to overhead waves. Ponta Preta is world-class right point break."
        skill_level: "intermediate-advanced"
        notes: "Ponta Preta can hold big swells. Several other spots around the island for variety."
      windsurfing:
        season: [11, 12, 1, 2, 3, 4, 5, 6]
        reliability: "80-90%"
        conditions: "Excellent wave sailing at Ponta Preta. Trade winds very consistent."
        skill_level: "intermediate-advanced"
        notes: "PWA wave tour stop. World-class conditions for expert wave sailors."
    climate:
      best_months: [11, 12, 1, 2, 3, 4]
      avg_temp_c:
        summer: 28
        winter: 24
        spring: 26
        autumn: 27
      rainy_months: [8, 9]
    logistics:
      airports: ["SID"]
      from_airport: "Amilcar Cabral Airport (SID) 15-20 min to Santa Maria. Direct flights from Europe."
      visa: "Visa on arrival for US/UK citizens, €30"
    accommodation:
      style: "Kite hotels, guesthouses, small resorts"
      budget_range: "$60-150/night"
      areas: ["Santa Maria", "Kite Beach", "Ponta Preta"]
    vibe: "Authentic African-Portuguese island culture. Relaxed pace, friendly locals, focus on water sports."
    why_go: "Warm water, reliable wind, world-class wave spot (Ponta Preta). Less crowded than Canaries."
    why_skip: "Remote island - limited infrastructure and nightlife. Can feel small after a week. Dusty landscape."
    last_updated: "2026-02"

